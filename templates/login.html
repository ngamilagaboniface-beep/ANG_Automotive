<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANG Automotive | BMW ///M Secure Access Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ang_telematics.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="m-power-top-bar"></div>
  <div class="m-panel" style="width: 100%; max-width: 440px; padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="m-badge-emblem" style="margin: 0 auto 0.75rem auto;">
        <div class="m-stripes-svg">
          <span class="b1"></span>
          <span class="b2"></span>
          <span class="b3"></span>
        </div>
        <span class="m-letter">M</span>
      </div>
      <h2 style="color: #fff; font-size: 1.35rem; font-weight: 900; letter-spacing: 0.04em;">ANG AUTOMOTIVE</h2>
      <p style="color: var(--text-secondary); font-size: 0.8rem; font-weight: 700;">ENGINEERING &amp; TELEMATICS AUTHENTICATION</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="m-badge m-badge-danger" style="display: block; width: 100%; padding: 0.6rem; margin-bottom: 1rem; text-align: center;">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
      <div class="m-form-group">
        <label class="m-form-label">Tuner Username</label>
        <input type="text" name="username" class="m-input" required placeholder="admin" autofocus>
      </div>
      <div class="m-form-group">
        <label class="m-form-label">Password / Security Key</label>
        <input type="password" name="password" class="m-input" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-m-action" style="width: 100%; padding: 0.85rem; margin-top: 0.75rem; justify-content: center;">
        <i class="fas fa-lock-open"></i> Authenticate Session
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.8rem;">
      <a href="/" style="color: var(--bmw-m-blue); text-decoration: none; font-weight: 700;"><i class="fas fa-arrow-left"></i> Return to Live Cockpit</a>
    </div>
  </div>
</body>
</html>
